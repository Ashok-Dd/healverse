name: Android APK

# Builds the APK on EAS (Expo cloud) and publishes it as a GitHub Release.
# Triggers:
#   - push a tag like v1.0.1 (builds and releases it);
#   - run manually from the Actions tab on main: with "publish" ticked and a tag name it also
#     creates the release, otherwise it only builds the APK as a workflow artifact.
# A release is only made for a commit that is on main and whose app.json version matches the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release (needs the tag below)"
        type: boolean
        default: false
      tag:
        description: "Release tag, e.g. v1.0.1 (must match app.json version)"
        type: string
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  EAS_CLI_VERSION: "27.10.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Empty means "build only, no release".
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.publish && inputs.tag) || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the "is on main" check needs history

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Require EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is not set"
            exit 1
          fi

      - name: Publish needs a tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag == ''
        run: |
          echo "::error::Tick publish only together with a tag name (for example v1.0.1)"
          exit 1

      - name: Tag must match app.json version
        if: env.RELEASE_TAG != ''
        run: |
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          if [ "${RELEASE_TAG#v}" != "$APP_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match app.json version $APP_VERSION"
            exit 1
          fi

      - name: Release commit must be on main
        if: env.RELEASE_TAG != ''
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not on main; merge it first, then release"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build APK on EAS (waits for the result)
        run: >
          npx --yes eas-cli@"$EAS_CLI_VERSION" build
          --platform android --profile preview
          --non-interactive --wait --json > build.json

      - name: Download the APK
        run: |
          URL="$(jq -r '.[0].artifacts.buildUrl // empty' build.json)"
          if [ -z "$URL" ]; then
            echo "::error::No artifact URL in EAS build output"
            jq 'del(.. | .metadata?)' build.json || true
            exit 1
          fi
          curl -fL --retry 3 -o healverse.apk "$URL"
          ls -l healverse.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: healverse-apk
          path: healverse.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" healverse.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HealVerse $RELEASE_TAG" \
            --generate-notes
